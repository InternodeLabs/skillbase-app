services:
  db:
    image: postgres:17
    container_name: skillbase-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: skillbase
      POSTGRES_PASSWORD: skillbase
      POSTGRES_DB: skillbase
    ports:
      # Host 5433 to avoid clashing with any Postgres already on 5432.
      - "5433:5432"
    volumes:
      - skillbase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skillbase -d skillbase"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  skillbase-db-data:
